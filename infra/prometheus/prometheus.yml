global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Metrics arrive via remote-write from Alloy (see ../alloy/config.alloy), not
# via scraping — the --web.enable-remote-write-receiver flag on the
# Prometheus container is what enables that endpoint. Self-scrape is kept
# just for basic visibility into Prometheus's own health.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
