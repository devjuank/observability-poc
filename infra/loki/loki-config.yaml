auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Required for OTLP log ingestion (Loki's native /otlp/v1/logs endpoint,
# used by Alloy's otelcol.exporter.loki) to carry span/trace IDs as
# structured metadata instead of dropping them.
limits_config:
  allow_structured_metadata: true
